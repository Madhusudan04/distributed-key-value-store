spring.application.name: distributed-kv-store

# KV Store Server
kvstore.server.port=6379
kvstore.server.thread-pool-size=10
kvstore.cache.capacity=10000
kvstore.cache.cleanup-interval=30000

# Logging
logging.level.com.kvstore.server=DEBUG
logging.level.com.kvstore.protocol=DEBUG
logging.level.com.kvstore.persistence=DEBUG

# AOF Persistence
kvstore.persistence.aof-file=data/appendonly.aof
kvstore.persistence.fsync-enabled=true
kvstore.persistence.fsync-interval=1000
